<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video.js HLS Player</title>
  
  <!-- Video.js CSS CDN -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .player-container {
      width: 100%;
      max-width: 800px;
      padding: 16px;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <video
      id="my-video"
      class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9"
      controls
      preload="auto"
      autoplay
      muted
      playsinline
      data-setup='{}'>
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a
        web browser that
        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>.
      </p>
    </video>
  </div>

  <!-- Video.js JS CDN -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const channelId = params.get("channel_id") ?? "7261da4b-9c45-4619-bfb0-a6119dc7b6e6";
    const videoUrl = `${window.location.origin}/live/${channelId}/playlist.m3u8`;
    console.log("load videojs", videoUrl);

    const player = videojs('my-video', {
        autoplay: true,
        controls: true,
        preload: 'auto',
        sources: [{
          src: videoUrl,
          type: 'application/x-mpegURL'
        }]
      });
  </script>

</body>
</html>
