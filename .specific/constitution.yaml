body: '# simlive Constitution


  ## Core Principles


  ### I. Library-First

  Every feature starts as a standalone, testable Go package under `internal/`; binaries
  in `cmd/` are thin entry points. No organizational-only packages.


  ### II. CLI Interface

  Every binary exposes functionality via CLI (stdin/args → stdout, errors → stderr);
  support text and JSON output where useful.


  ### III. Test-First (NON-NEGOTIABLE)

  TDD mandatory: tests written → user approved → tests fail → then implement; Red-Green-Refactor
  strictly enforced (`go test ./...`).


  ### IV. Integration Testing

  Focus areas requiring integration tests: new package contract tests, GORM model/schema
  changes, HLS segment/SCTE-35 verification paths, Redis/PostgreSQL interaction.


  ### V. Observability & Simplicity

  Structured logging via lumberjack; start simple, YAGNI; version with MAJOR.MINOR.PATCH.


  ## Additional Constraints


  Technology stack: Go 1.26+, Gin, GORM/PostgreSQL, Redis, Vue 3 + Vite + Vuetify
  (client). External tools: tsduck, ffmpeg/ffprobe, rclone. Environment via `.env`.


  ## Development Workflow


  Code review required; `make fmt`/`make vet`/`make test` must pass before merge;
  spec-kit flow for feature work.


  ## Governance


  Constitution supersedes all other practices. Amendments require documentation, approval,
  and migration plan. All PRs must verify compliance.


  **Version**: 1.0.0 | **Ratified**: 2026-11-01 | **Last Amended**: 2026-11-01

  <!-- Sync Impact Report: initial constitution generated during init-flow -->'
